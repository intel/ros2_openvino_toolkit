name: Ubuntu-26.04-Lyrical-CI

on:
  push:
    branches: [ "ros2_lyrical" ]
  pull_request:
    branches: [ "ros2_lyrical" ]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git \
          python3-colcon-common-extensions build-essential cmake libopencv-dev \
          ros-lyrical-cv-bridge ros-lyrical-librealsense2 ros-lyrical-yaml-cpp-vendor

    - name: install openvino 2026.4.1
      run: |
        # https://docs.openvino.ai/2026/get-started/install-openvino/install-openvino-apt.html
        ./script/packaging/setup_openvino_apt.sh
        apt-get install -y openvino-libraries-dev-2026.4.1

    - name: build ros2 openvino toolkit
      shell: bash
      run: |
        mkdir -p ~/ros2_ws/src
        cp -rf ${GITHUB_WORKSPACE} ~/ros2_ws/src/ros2_openvino_toolkit
        cd ~/ros2_ws
        source /opt/ros/lyrical/setup.bash
        colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
