Pipelines:
- name: segmentation
  inputs: [Image]
  input_path: <OPENVINO_DATA>/images/sample_car.png
  infers:
    - name: ObjectSegmentationMaskrcnn
      model: <OPENVINO_NODE_SHARE>/models/public/mask_rcnn_inception_resnet_v2_atrous_coco/FP16/mask_rcnn_inception_resnet_v2_atrous_coco.xml
      engine: CPU #"HETERO:CPU,GPU,NPU"
      label: <OPENVINO_DATA>/labels/object_segmentation/frozen_inference_graph.labels
      batch: 1
      confidence_threshold: 0.5
  outputs: [RosTopic]
  connects:
    - left: Image
      right: [ObjectSegmentationMaskrcnn]
    - left: ObjectSegmentationMaskrcnn
      right: [RosTopic]

OpenvinoCommon:
