Pipelines:
- name: segmentation
  inputs: [StandardCamera]
  infers:
    - name: ObjectSegmentationMaskrcnn
      model: <OPENVINO_NODE_SHARE>/models/convert/public/mask_rcnn_inception_resnet_v2_atrous_coco/FP16/mask_rcnn_inception_resnet_v2_atrous_coco.xml
      engine: GPU
      label: <OPENVINO_DATA>/labels/object_segmentation/frozen_inference_graph.labels
      batch: 1
      confidence_threshold: 0.5
  outputs: [RosTopic, RViz]
  connects:
    - left: StandardCamera
      right: [ObjectSegmentationMaskrcnn]
    - left: ObjectSegmentationMaskrcnn
      right: [RosTopic]
    - left: ObjectSegmentationMaskrcnn
      right: [RosTopic]
    - left: ObjectSegmentationMaskrcnn
      right: [RViz]

OpenvinoCommon:
