Pipelines:
- name: object
  inputs: [StandardCamera]
  input_path: to/be/set/image_path
  infers:
    - name: ObjectDetection
      #model: <OPENVINO_NODE_SHARE>/models/convert/public/yolov5n/FP32/yolov5n.xml
      model: <OPENVINO_NODE_SHARE>/models/yolov7_int8.xml
      #model: <OPENVINO_NODE_SHARE>/models/yolov8n_openvino_int8_model/yolov8n.xml
      model_type: yolov5 #yolov8
      engine: CPU #NPU
      label: <OPENVINO_DATA>/labels/object_detection/coco.labels
      batch: 1
      confidence_threshold: 0.5
      enable_roi_constraint: true # set enable_roi_constraint to false if you don't want to make the inferred ROI (region of interest) constrained into the camera frame
  outputs: [RosTopic, RViz]
  connects:
    - left: StandardCamera
      right: [ObjectDetection]
    - left: ObjectDetection
      right: [RosTopic, RViz]

OpenvinoCommon:
