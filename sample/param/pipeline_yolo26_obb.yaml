Pipelines:
- name: obb
  inputs: [StandardCamera]
  infers:
    - name: OrientedObjectDetection
      model: <OPENVINO_NODE_SHARE>/models/yolo26/yolo26n-obb/FP16/yolo26n-obb.xml
      engine: CPU #GPU #NPU
      label: <OPENVINO_NODE_SHARE>/models/yolo26/yolo26n-obb/FP16/yolo26n-obb.labels
      batch: 1
      confidence_threshold: 0.5
  outputs: [RosTopic, RViz]
  connects:
    - left: StandardCamera
      right: [OrientedObjectDetection]
    - left: OrientedObjectDetection
      right: [RosTopic, RViz]

Common:
