Pipelines:
- name: object
  inputs: [StandardCamera]
  infers:
    - name: ObjectDetection
      model: <OPENVINO_NODE_SHARE>/models/intel/person-detection-retail-0013/FP32/person-detection-retail-0013.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/object_detection/person-detection.labels
      batch: 1
      confidence_threshold: 0.5
      enable_roi_constraint: true # set enable_roi_constraint to false if you don't want to make the inferred ROI (region of interest) constrained into the camera frame
    - name: PersonReidentification
      model: <OPENVINO_NODE_SHARE>/models/intel/person-reidentification-retail-0277/FP32/person-reidentification-retail-0277.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/person-reidentification/person-reidentification-retail-0277.labels
      batch: 1
      confidence_threshold: 0.7
  outputs: [RViz, RosTopic]
  connects:
    - left: StandardCamera
      right: [ObjectDetection]
    - left: ObjectDetection
      right: [PersonReidentification]
    - left: PersonReidentification
      right: [RViz, RosTopic]

OpenvinoCommon:
