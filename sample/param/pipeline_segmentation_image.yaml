Pipelines:
- name: segmentation
  inputs: [Image]
  input_path: <OPENVINO_DATA>/images/sample_faces.jpg
  infers:
    - name: ObjectSegmentation
      model: <OPENVINO_NODE_SHARE>/models/intel/semantic-segmentation-adas-0001/FP16/semantic-segmentation-adas-0001.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/object_segmentation/frozen_inference_graph.labels
      batch: 1
      confidence_threshold: 0.5
  outputs: [RosTopic, RViz]
  connects:
    - left: Image
      right: [ObjectSegmentation]
    - left: ObjectSegmentation
      right: [RosTopic, RViz]

OpenvinoCommon:
