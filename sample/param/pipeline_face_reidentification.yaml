Pipelines:
- name: people
  inputs: [RealSenseCamera]
  infers:
    - name: FaceDetection
      model: <OPENVINO_NODE_SHARE>/models/intel/face-detection-adas-0001/FP16/face-detection-adas-0001.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/face_detection/face-detection-adas-0001.labels
      batch: 1
      confidence_threshold: 0.5
      enable_roi_constraint: true # set enable_roi_constraint to false if you don't want to make the inferred ROI (region of interest) constrained into the camera frame
    - name: LandmarksDetection
      model: <OPENVINO_NODE_SHARE>/models/intel/landmarks-regression-retail-0009/FP32/landmarks-regression-retail-0009.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/landmarks-regression/landmarks-regression-retail-0009.labels
      batch: 1
    - name: FaceReidentification
      model: <OPENVINO_NODE_SHARE>/models/intel/face-reidentification-retail-0095/FP32/face-reidentification-retail-0095.xml
      engine: CPU
      label: <OPENVINO_DATA>/labels/face-reidentification/face-reidentification-retail-0095.labels
      batch: 1
      confidence_threshold: 0.9
  outputs: [RosTopic, RViz]
  connects:
    - left: RealSenseCamera
      right: [FaceDetection]
    - left: FaceDetection
      right: [LandmarksDetection, FaceReidentification]
    - left: FaceDetection
      right: [RosTopic, RViz]
    - left: LandmarksDetection
      right: [RosTopic, RViz]
    - left: FaceReidentification
      right: [RosTopic, RViz]

