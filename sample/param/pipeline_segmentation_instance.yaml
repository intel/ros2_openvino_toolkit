Pipelines:
- name: segmentation
  inputs: [StandardCamera]
  infers:
    - name: ObjectSegmentationInstance
      # for Yolov8 Seg models -----------------
      model: <OPENVINO_NODE_SHARE>/models/convert/public/yolov8n-seg/FP32/yolov8n-seg.xml
      model_type: yolo
      label: <OPENVINO_DATA>/labels/object_detection/coco.labels
      # for maskrcnn inception resnet -----------------
      #model: <OPENVINO_NODE_SHARE>/models/public/mask_rcnn_inception_resnet_v2_atrous_coco/FP32/mask_rcnn_inception_resnet_v2_atrous_coco.xml
      #model_type: maskrcnn
      #label: <OPENVINO_DATA>/labels/object_segmentation/frozen_inference_graph.labels #for maskrcnn
      #----------------------
      engine: CPU #"HETERO:CPU,GPU," #"HETERO:CPU,GPU,NPU"
      batch: 1
      confidence_threshold: 0.5
      nms_threshold: 0.5
  outputs: [RosTopic, RViz]
  connects:
    - left: StandardCamera
      right: [ObjectSegmentationInstance]
    - left: ObjectSegmentationInstance
      right: [RosTopic, RViz]

Common:
