Pipelines:
- name: segmentation
  inputs: [Video]
  input_path: to/be/set/video_path
  infers:
    - name: ObjectSegmentation
      model: <OPENVINO_NODE_SHARE>/models/convert/public/deeplabv3/FP16/deeplabv3.xml
      engine: CPU #GPU
      label: <OPENVINO_DATA>/labels/object_segmentation/frozen_inference_graph.labels
      batch: 1
      confidence_threshold: 0.5
  outputs: [RosTopic, RViz]
  connects:
    - left: Video
      right: [ObjectSegmentation]
    - left: ObjectSegmentation
      right: [RosTopic, RViz]

OpenvinoCommon:
