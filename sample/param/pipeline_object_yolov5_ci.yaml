Pipelines:
- name: object
  inputs: [Image]
  input_path: <OPENVINO_DATA>/images/sample_faces.jpg
  infers:
    - name: ObjectDetection
      model: <OPENVINO_NODE_SHARE>/models/convert/public/yolov5n/FP32/yolov5n.xml
      model_type: yolov5
      engine: CPU #NPU
      label: <OPENVINO_DATA>/labels/object_detection/coco.labels
      batch: 1
      confidence_threshold: 0.5
      enable_roi_constraint: true # set enable_roi_constraint to false if you don't want to make the inferred ROI (region of interest) constrained into the camera frame
  outputs: [RosTopic]
  connects:
    - left: Image
      right: [ObjectDetection]
    - left: ObjectDetection
      right: [RosTopic]

OpenvinoCommon:
